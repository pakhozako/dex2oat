services:
  database:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:16-alpine}
    container_name: dex2oat-panel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dex2oat_directus}
      POSTGRES_USER: ${POSTGRES_USER:-dex2oat_directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=localhost --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  directus:
    image: ${DIRECTUS_IMAGE:-ghcr.io/directus/directus:12.0.2}
    container_name: dex2oat-panel
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${DEX2OAT_PANEL_BIND:-127.0.0.1}:${DEX2OAT_PANEL_PORT:-18083}:8055"
    environment:
      KEY: ${DIRECTUS_KEY:?DIRECTUS_KEY is required}
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET is required}
      PUBLIC_URL: ${DEX2OAT_PANEL_PUBLIC_URL:-http://127.0.0.1:18083}
      SERVE_APP: "true"
      TELEMETRY: "false"
      LOG_LEVEL: ${DIRECTUS_LOG_LEVEL:-info}

      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-dex2oat_directus}
      DB_USER: ${POSTGRES_USER:-dex2oat_directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      CACHE_ENABLED: "false"
      CACHE_AUTO_PURGE: "true"
      SYNCHRONIZATION_STORE: "memory"

      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: "memory"
      RATE_LIMITER_POINTS: ${DIRECTUS_RATE_LIMITER_POINTS:-120}
      RATE_LIMITER_DURATION: ${DIRECTUS_RATE_LIMITER_DURATION:-60}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?DIRECTUS_ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD is required}
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8055/server/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
